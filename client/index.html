<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SciBoom! บูมวิทย์</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1b1d3a;
        overflow: hidden;
        touch-action: none;
        font-family: 'Kanit', sans-serif;
      }
      #game { width: 100%; height: 100%; }
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        background: #1b1d3a;
        color: #fff;
        font-size: 22px;
        text-align: center;
        padding: 16px;
      }
      /* Phones held upright: ask the player to rotate to landscape */
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate-hint { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-hint">
      <svg class="icon" width="96" height="96" viewBox="0 0 96 96" aria-hidden="true"><rect x="30" y="14" width="36" height="62" rx="7" fill="none" stroke="#ffcc33" stroke-width="5"/><circle cx="48" cy="67" r="3.5" fill="#ffcc33"/><path d="M14 58 A36 36 0 0 1 24 24" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M16 20 L25 23 L22 32" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>กรุณาหมุนจอเป็นแนวนอน<br />เพื่อเล่นเกม</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
